<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Auction details | OleBid</title>

    <meta
      name="description"
      content="View auction details, seller information and bidding activity on OleBid."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;family=Fraunces:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/listing.ts"></script>
  </head>

  <body>
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-3 focus:text-burgundy"
    >
      Skip to content
    </a>

    <div id="site-header"></div>

    <main id="main-content" tabindex="-1" class="px-4">
      <div class="mx-auto w-full max-w-300 py-8 md:py-12">
        <a
          href="/"
          class="inline-flex min-h-12 items-center rounded-lg text-burgundy underline-offset-4 hover:underline"
        >
          ← Back to auctions
        </a>

        <p
          id="listing-details-status"
          role="status"
          aria-atomic="true"
          class="mt-4 text-base leading-6 text-muted"
        ></p>

        <button
          id="listing-details-retry"
          type="button"
          hidden
          class="mt-4 min-h-12 rounded-lg border border-burgundy px-6 py-3 font-medium text-burgundy hover:bg-burgundy-soft"
        >
          Try again
        </button>

        <div id="listing-details" class="mt-8"></div>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
