<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OleBid | Student auctions</title>

    <meta
      name="description"
      content="Discover student auctions on OleBid. Browse listings and bid on your next favourite with virtual credits."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;family=Fraunces:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-3 focus:text-burgundy"
    >
      Skip to content
    </a>

    <div id="site-header"></div>

    <main id="main-content" tabindex="-1" class="px-4">
      <div class="mx-auto w-full max-w-300 py-8 md:py-12">
        <h1
          class="font-heading text-[2rem] leading-tight font-semibold md:text-[2.5rem]"
        >
          Find your next favourite.
        </h1>

        <p class="mt-4 text-lg leading-7 text-muted">
          Discover student listings and bid with virtual credits.
        </p>

        <form
          id="listing-search-form"
          role="search"
          aria-label="Search auctions"
          class="mt-10"
        >
          <label
            for="listing-search"
            class="mb-2 block text-base leading-6 font-medium"
          >
            Search auctions
          </label>

          <div class="flex flex-col gap-4 sm:flex-row">
            <input
              id="listing-search"
              name="q"
              type="search"
              placeholder="Search by title or description"
              class="min-h-13.5 min-w-0 flex-1 rounded-lg border border-muted bg-surface px-4 py-3 text-lg leading-7 placeholder:text-muted focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-ink"
            />

            <button
              type="submit"
              class="min-h-13.5 rounded-lg bg-burgundy px-8 py-3 font-medium text-surface hover:bg-burgundy-hover"
            >
              Search
            </button>
          </div>

          <p class="mt-2 text-sm leading-6 text-muted">
            Clear the search and submit again to browse all active auctions.
          </p>
        </form>

        <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <div id="listing-sort"></div>
        </div>

        <section aria-labelledby="auctions-heading" class="mt-12">
          <h2
            id="auctions-heading"
            tabindex="-1"
            class="font-heading text-[1.75rem] leading-9 font-semibold"
          >
            Available auctions
          </h2>

          <p
            id="listing-status"
            role="status"
            aria-atomic="true"
            class="mt-4 text-base leading-6 text-muted"
          ></p>

          <button
            id="listing-retry"
            type="button"
            hidden
            class="mt-4 min-h-12 rounded-lg border border-burgundy px-6 py-3 font-medium text-burgundy hover:bg-burgundy-soft"
          >
            Try again
          </button>

          <ul
            id="listing-grid"
            class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
          ></ul>

          <div id="listing-pagination" class="mt-8"></div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
