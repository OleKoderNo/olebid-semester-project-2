<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OleBid | Student auctions</title>

    <meta
      name="description"
      content="Discover student auctions on OleBid. Browse listings and bid on your next favourite with virtual credits."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;family=Fraunces:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-3 focus:text-burgundy"
    >
      Skip to content
    </a>

    <div id="site-header"></div>

    <main id="main-content" tabindex="-1" class="px-4">
      <div class="mx-auto w-full max-w-300 py-8 md:py-12">
        <h1
          class="font-heading text-[2rem] leading-tight font-semibold md:text-[2.5rem]"
        >
          Find your next favourite.
        </h1>

        <p class="mt-4 text-lg leading-7 text-muted">
          Discover student listings and bid with virtual credits.
        </p>

        <section aria-labelledby="auctions-heading" class="mt-12">
          <h2
            id="auctions-heading"
            class="font-heading text-[1.75rem] leading-9 font-semibold"
          >
            Available auctions
          </h2>

          <p
            id="listing-status"
            role="status"
            aria-atomic="true"
            class="mt-4 text-base leading-6 text-muted"
          ></p>

          <button
            id="listing-retry"
            type="button"
            hidden
            class="mt-4 min-h-12 rounded-lg border border-burgundy px-6 py-3 font-medium text-burgundy hover:bg-burgundy-soft"
          >
            Try again
          </button>

          <ul
            id="listing-grid"
            class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
          ></ul>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
