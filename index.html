<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;family=Fraunces:wght@600;700&amp;display=swap"

    <script type="module" src="/src/main.ts"></script>

  <body>
    <a

                aria-current="page"
                class="text-burgundy underline underline-offset-4"

              </a>
            </li>

            <li>

            <li>
              <a href="/register/" class="text-burgundy"> Register </a>

        <h1

        </h1>

        <p class="mt-4 text-lg leading-7 text-muted">
