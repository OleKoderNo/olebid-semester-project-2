<header class="bg-surface px-4">
  <div
    class="mx-auto flex min-h-20 w-full max-w-300 flex-wrap items-center justify-between gap-4 py-4 lg:min-h-24 lg:flex-nowrap"
  >
    <a
      href="/"
      class="shrink-0 font-heading text-[2rem] leading-tight font-bold"
    >
      OleBid
    </a>

    <button
      id="menu-toggle"
      type="button"
      aria-controls="main-navigation"
      aria-expanded="false"
      hidden
      class="min-h-12 rounded-lg border border-burgundy px-6 py-3 font-medium text-burgundy hover:bg-burgundy-soft"
    >
      Menu
    </button>

    <nav
      id="main-navigation"
      aria-label="Main navigation"
      class="w-full lg:w-auto"
    >
      <ul class="flex flex-col gap-3 lg:flex-row lg:items-center lg:gap-4">
        <li>
          <a
            href="/"
            class="flex min-h-12 items-center justify-center rounded-lg border border-burgundy px-6 py-3 text-burgundy hover:bg-burgundy-soft lg:justify-start lg:border-0 lg:px-0 lg:hover:bg-transparent"
          >
            Browse auctions
          </a>
        </li>

        <li
          data-account-controls
          class="flex min-w-0 flex-col gap-3 lg:flex-row lg:items-center lg:gap-4"
        ></li>
      </ul>
    </nav>
  </div>
</header>
